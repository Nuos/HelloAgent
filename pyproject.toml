[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-python"
version = "0.1.0"
description = "Claude Code 类 Agent 的 Python 教学/开发实现，目录结构对齐 claude-code-sourcemap 还原源码（v2.1.88）"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code", "src/claude_code_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 中文 docstring/注释中的全角标点（：、，）是正常用法，RUF001/2/3 误报
"*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["claude_code", "claude_code_ui"]
mypy_path = "src"
